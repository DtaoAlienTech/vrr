<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" role="img" aria-label="V.R.R. Degree College logo">
  <defs>
    <linearGradient id="sh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E6EEF9"/></linearGradient>
    <linearGradient id="bl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2A6BD0"/><stop offset="1" stop-color="#123A78"/></linearGradient>
    <linearGradient id="rd" gradientUnits="userSpaceOnUse" x1="0" x2="0" y1="168" y2="226"><stop offset="0" stop-color="#E8382E"/><stop offset="1" stop-color="#B51F1F"/></linearGradient>
    <path id="r" d="M66 214 V174 H90 a12.5 12.5 0 0 1 0 25 H66 M84 199 L102 214"/>
  </defs>
  <!-- shield -->
  <path d="M22 34 Q120 12 218 34 V146 C218 216 170 252 120 272 C70 252 22 216 22 146 Z" fill="url(#sh)" stroke="#123A78" stroke-width="6" stroke-linejoin="round"/>
  <path d="M33 45 Q120 27 207 45 V146 C207 208 165 240 120 257 C75 240 33 208 33 146 Z" fill="none" stroke="#1B4F9C" stroke-opacity=".3" stroke-width="2"/>
  <g transform="translate(0 10)">
    <!-- people halo -->
    <g fill="#1B4F9C">
      <circle cx="170.2" cy="75" r="4"/><circle cx="157.3" cy="59.6" r="4.4"/><circle cx="139.8" cy="49.5" r="4.8"/><circle cx="120" cy="46" r="5.2"/>
      <circle cx="100.2" cy="49.5" r="4.8"/><circle cx="82.7" cy="59.6" r="4.4"/><circle cx="69.8" cy="75" r="4"/>
    </g>
    <!-- student with raised arms and graduation cap -->
    <path d="M76 88 L96 82 L120 128 L144 82 L164 88 L120 156 Z" fill="url(#bl)"/>
    <circle cx="120" cy="99" r="11" fill="url(#bl)"/>
    <path d="M100 86 L120 77 L140 86 L120 95 Z" fill="#123A78"/>
    <path d="M138 87 V98" stroke="#123A78" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- RR monogram -->
  <g transform="translate(6.75 10)" fill="none" stroke="url(#rd)" stroke-width="11" stroke-linejoin="miter">
    <use href="#r"/><use href="#r" x="58"/>
  </g>
</svg>
