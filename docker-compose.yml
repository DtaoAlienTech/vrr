# Development services. Backend and frontend run on the host for hot reload.
# Production adds backend, frontend and caddy in docker-compose.prod.yml (Phase 5).
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: vrr-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vrr}
      POSTGRES_USER: ${POSTGRES_USER:-vrr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      # Bound to localhost only, never exposed to the network.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
