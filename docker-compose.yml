# One command builds and starts everything:
#
#   docker compose up -d --build        then open http://localhost:3000
#
# caddy    The single entry point: /api goes to the backend, everything else to the website
# frontend Next.js website. Builds its pages from the live API when it starts (first start: a few
#          minutes; later starts reuse the saved build)
# backend  FastAPI. Applies database migrations and adds the starter content on start, then serves /api
# mailcatcher  (optional, `--profile mail`) test mailbox that prints enquiry emails
# db       PostgreSQL (also usable alone for local development: docker compose up -d db)
#
# Settings come from the .env file next to this one (copy .env.example and replace CHANGE_ME).
name: vrr-college

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: vrr-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vrr}
      POSTGRES_USER: ${POSTGRES_USER:-vrr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      # Bound to localhost only, never exposed to the network.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: ./backend
    container_name: vrr-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENV: ${ENV:-dev}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vrr}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vrr}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      # "backend" is the name the other containers use to reach this one.
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1},backend
      # Caddy is the one proxy in front of the API and adds the visitor's real address.
      TRUSTED_PROXY_HOPS: "1"
      ENQUIRY_TO_EMAIL: ${ENQUIRY_TO_EMAIL:-}
      ENQUIRY_RATE_LIMIT_PER_HOUR: ${ENQUIRY_RATE_LIMIT_PER_HOUR:-5}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      REVALIDATE_URL: http://frontend:3000/internal/revalidate
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?Set REVALIDATE_SECRET in .env}
      # Photos and PDFs are saved here (a volume Caddy also reads) ...
      UPLOAD_DIR: /data/uploads
      # ... and the photos exactly as uploaded are kept here (private: never served).
      ORIGINALS_DIR: /data/originals
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      # 1 = add the starter content when the database is empty (never touches existing content)
      SEED_ON_START: ${SEED_ON_START:-1}
      # Development only (the backend refuses to start with these set when ENV=prod)
      DEV_ADMIN_EMAIL: ${DEV_ADMIN_EMAIL:-}
      DEV_ADMIN_PASSWORD: ${DEV_ADMIN_PASSWORD:-}
    volumes:
      - uploads:/data/uploads
      - originals:/data/originals
    # No published port: the only way in is through Caddy.
    # Hardening: read-only filesystem (only the two upload volumes are writable), no extra privileges.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Optional test mailbox: it prints the enquiry emails instead of sending them, so you can try the
  # email without a real mail account. Not started by `docker compose up`; see the README
  # ("Try the enquiry email").   docker compose --profile mail up -d mailcatcher
  mailcatcher:
    profiles: ["mail"]
    image: vrr-college-backend
    build: ./backend
    container_name: vrr-mailcatcher
    restart: "no"
    # The backend image starts the API by default; this replaces that with the test mailbox
    # (and turns off the API health check the image carries).
    entrypoint: ["python", "-m", "app.devtools.mail_sink", "1025"]
    healthcheck:
      disable: true
    # Only the other containers can reach it (no published port).
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  frontend:
    build: ./frontend
    container_name: vrr-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Read when the site is built at start-up (and by the running server).
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?Set REVALIDATE_SECRET in .env}
    volumes:
      # The saved build, so a restart does not build again (it rebuilds when the code changes).
      - next_build:/app/.next
    # No published port: the only way in is through Caddy.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    container_name: vrr-caddy
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - uploads:/srv/uploads:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 10s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
  uploads:
  originals:
  next_build:
  caddy_data:
  caddy_config:
