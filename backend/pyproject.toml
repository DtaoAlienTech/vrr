[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vrr-college-backend"
version = "0.1.0"
description = "API for the VRR Degree College website"
requires-python = ">=3.12"
# Only what the code uses today. Each later phase adds its own packages.
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  # admin login: Argon2id passwords, signed access tokens, two-factor codes, encrypted 2FA secrets
  "argon2-cffi>=25.1",
  "PyJWT>=2.10",
  "pyotp>=2.9",
  "cryptography>=45",
  # photo and PDF uploads: Pillow reads and resizes images, python-multipart reads the upload
  "Pillow>=12",
  "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pip-audit>=2.7"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
# E/F/I basics, B bugbear, UP modern syntax, S security (bandit), C4/SIM simplifications
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# tests use asserts and dummy passwords
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
